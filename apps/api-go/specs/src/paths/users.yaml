get:
  summary: ユーザー情報取得
  description: |
    指定されたユーザーIDのユーザー情報を取得します。
    セキュリティのため、自分自身の情報のみ取得可能です。
  operationId: getUser
  tags:
    - Users
  security:
    - JWT: []
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
        format: int32
      description: ユーザーID
  responses:
    '200':
      description: ユーザー情報取得成功
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: true
              data:
                $ref: ../components/schemas/auth/User.yaml
    '403':
      $ref: ../components/responses/common/Forbidden.yaml
    '404':
      $ref: ../components/responses/common/NotFound.yaml
    '500':
      $ref: ../components/responses/common/InternalServerError.yaml
