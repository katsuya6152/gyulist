description: ユーザーログインリクエスト
required: true
content:
  application/json:
    schema:
      type: object
      properties:
        email:
          type: string
          format: email
          description: ユーザーのメールアドレス
          example: user@example.com
        password:
          type: string
          minLength: 8
          description: パスワード（8文字以上）
          example: password123
      required:
        - email
        - password
