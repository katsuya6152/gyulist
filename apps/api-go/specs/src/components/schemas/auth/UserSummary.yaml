# ユーザー情報サマリー
type: object
description: ログイン時のユーザー情報
properties:
  id:
    type: integer
    description: ユーザーID
    example: 1
  userName:
    type: string
    description: ユーザー名
    example: "田中太郎"
  email:
    type: string
    format: email
    description: メールアドレス
    example: user@example.com
  theme:
    type: string
    enum: [light, dark, auto]
    description: UIテーマ設定
    example: light
required:
  - id
  - userName
  - email
